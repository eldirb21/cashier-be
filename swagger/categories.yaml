tags:
  - name: Category
    description: Manajemen kategori produk barang

components:
  schemas:
    Category:
      type: object
      required:
        - name
      properties:
        id:
          type: string
          example: "CAT-001"
        name:
          type: string
          example: "Makanan"
        description:
          type: string
          example: "Kategori produk makanan & camilan"
        slug:
          type: string
          example: "makanan"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

paths:
  /api/categories:
    post:
      summary: Tambah kategori (ADMIN / MANAGER / OWNER)
      tags:
        - Category
      security:
        - BearerAuth: []
        - cookieAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                id:
                  type: string
                  description: ID kustom (opsional, jika tidak diisi akan dibuat `CAT-timestamp`)
                  example: "CAT-001"
                name:
                  type: string
                  example: "Makanan"
                description:
                  type: string
                  example: "Kategori produk makanan & camilan"
                slug:
                  type: string
                  example: "makanan"
                is_active:
                  type: boolean
                  default: true
                  example: true

      responses:
        "201":
          description: Kategori berhasil dibuat
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Kategori berhasil dibuat"
                  data:
                    $ref: "#/components/schemas/Category"

        "400":
          description: Validasi gagal / nama kategori wajib diisi

        "401":
          description: Tidak terautentikasi

        "403":
          description: Tidak punya izin

        "409":
          description: ID atau Slug sudah digunakan

        "500":
          description: Server error

    get:
      summary: Ambil semua kategori
      tags:
        - Category
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Cari berdasarkan nama / description / slug
          example: "Makanan"
        - in: query
          name: is_active
          schema:
            type: boolean
          description: Filter status aktif (true/false)

      responses:
        "200":
          description: List kategori
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "List kategori berhasil diambil"
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"

        "500":
          description: Server error

  /api/categories/{id}:
    get:
      summary: Detail kategori (by ID or Slug)
      tags:
        - Category

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID atau Slug Kategori
          example: "CAT-001"

      responses:
        "200":
          description: Detail kategori
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Detail kategori"
                  data:
                    $ref: "#/components/schemas/Category"

        "404":
          description: Kategori tidak ditemukan

        "500":
          description: Server error

    put:
      summary: Update kategori (ADMIN / MANAGER / OWNER)
      tags:
        - Category
      security:
        - BearerAuth: []
        - cookieAuth: []

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: "CAT-001"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Makanan & Minuman"
                description:
                  type: string
                  example: "Kategori gabungan makanan dan minuman"
                slug:
                  type: string
                  example: "makanan-minuman"
                is_active:
                  type: boolean
                  example: true

      responses:
        "200":
          description: Kategori berhasil diupdate
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Kategori berhasil diupdate"
                  data:
                    $ref: "#/components/schemas/Category"

        "401":
          description: Tidak terautentikasi

        "403":
          description: Tidak punya izin

        "404":
          description: Kategori tidak ditemukan

        "409":
          description: Slug kategori sudah digunakan

        "500":
          description: Server error

    delete:
      summary: Hapus kategori (ADMIN / OWNER)
      tags:
        - Category
      security:
        - BearerAuth: []
        - cookieAuth: []

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          example: "CAT-001"

      responses:
        "200":
          description: Kategori berhasil dihapus
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Kategori berhasil dihapus"

        "401":
          description: Tidak terautentikasi

        "403":
          description: Tidak punya izin

        "404":
          description: Kategori tidak ditemukan

        "500":
          description: Server error
