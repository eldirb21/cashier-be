openapi: 3.0.0
info:
  title: Authentication API
  description: API untuk autentikasi pengguna
  version: 1.0.0

security:
  - BearerAuth: []
  - cookieAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: authorization
 
  schemas:
    Role:
      type: string
      enum:
        - CUSTOMER
        - CASHIER
        - ADMIN
        - SPV
        - MANAGER
        - OWNER
        - OTHER
      example: CUSTOMER

paths:
  /api/auth/register:
    post:
      summary: Register pengguna baru
      tags:
        - Auth

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - identifier
                - password
              properties:
                name:
                  type: string
                  example: "John Doe"

                identifier:
                  type: string
                  description: "Email atau nomor HP (08xxx / +62xxx)"
                  example: "john@mail.com"

                password:
                  type: string
                  format: password
                  example: "password123"

                role:
                  $ref: "#/components/schemas/Role"
                  description: >
                    Role user (optional). 
                    Default: CUSTOMER.
                    Tidak semua role bisa dipilih (ADMIN & OWNER dibatasi).

      responses:
        "201":
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Registrasi berhasil"

                  status:
                    type: integer
                    example: 201

                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1

                          name:
                            type: string
                            example: "John Doe"

                          email:
                            type: string
                            nullable: true
                            example: "john@mail.com"

                          phone:
                            type: string
                            nullable: true
                            example: "08123456789"

                          role:
                            $ref: "#/components/schemas/Role"

                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

                      refreshToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

        "400":
          description: Validasi gagal / input tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Role tidak valid"
                  status:
                    type: integer
                    example: 400

        "403":
          description: Role tidak diizinkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Tidak diizinkan memilih role ini"
                  status:
                    type: integer
                    example: 403

        "409":
          description: Data sudah terdaftar
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Email sudah terdaftar"
                  status:
                    type: integer
                    example: 409

        "500":
          description: Server error

  /api/auth/login:
    post:
      summary: Login pengguna
      tags:
        - Auth

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - password
              properties:
                identifier:
                  type: string
                  example: "john@mail.com"
                  description: "Email atau nomor HP"

                password:
                  type: string
                  format: password
                  example: "password123"

      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Login berhasil"

                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: integer
                            example: 1

                          name:
                            type: string
                            example: "John Doe"

                          email:
                            type: string
                            nullable: true

                          phone:
                            type: string
                            nullable: true

                          role:
                            type: string
                            example: "CUSTOMER"

                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

                      refreshToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

        "400":
          description: Validasi gagal

        "401":
          description: Identifier atau password salah

        "403":
          description: Akun dinonaktifkan

        "500":
          description: Server error

  /api/auth/refresh:
    post:
      summary: Refresh access token
      tags:
        - Auth

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

      responses:
        "200":
          description: Token berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Token diperbarui"

                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string

                      refreshToken:
                        type: string

        "400":
          description: Bad request

        "401":
          description: Token tidak valid / expired

        "403":
          description: Akun tidak aktif

  /api/auth/logout:
    post:
      summary: Logout pengguna
      tags:
        - Auth
      security:
        - BearerAuth: []
        - cookieAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

      responses:
        "200":
          description: logout success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Token diperbarui"

                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string

                      refreshToken:
                        type: string

        "400":
          description: Bad request

        "401":
          description: Token tidak valid / expired

        "403":
          description: Akun tidak aktif

  /api/auth/forgot-password:
    post:
      summary: Forgot-password pengguna
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
              properties:
                identifier:
                  type: string
                  example: "example@gmail.com"

      responses:
        "200":
          description: Forgot-password success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Forgot-password diperbarui"

                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string

                      refreshToken:
                        type: string

        "400":
          description: Bad request

        "401":
          description: Token tidak valid / expired

        "403":
          description: Akun tidak aktif

  /api/auth/reset-password:
    post:
      summary: reset-password pengguna
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tokenAccess
                - password
              properties:
                tokenAccess:
                  type: string
                  example: "example@gmail.com"
                password:
                  type: string
                  example: "@134134!L"

      responses:
        "200":
          description: reset-password success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "reset-password diperbarui"

                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string

                      refreshToken:
                        type: string

        "400":
          description: Bad request

        "401":
          description: Token tidak valid / expired

        "403":
          description: Akun tidak aktif

  /api/auth/me:
    get:
      summary: Profile pengguna
      tags:
        - Auth
      security:
        - BearerAuth: []
        - cookieAuth: []

      responses:
        "200":
          description: Change-password success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Change-password diperbarui"

                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string

                      refreshToken:
                        type: string

  /api/auth/change-password:
    patch:
      summary: Change-password pengguna
      tags:
        - Auth
      security:
        - BearerAuth: []
        - cookieAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  example: "@135790eL"
                newPassword:
                  type: string
                  example: "@324ErL!"

      responses:
        "200":
          description: Change-password success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Change-password diperbarui"

                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string

                      refreshToken:
                        type: string

        "400":
          description: Bad request

        "401":
          description: Token tidak valid / expired

        "403":
          description: Akun tidak aktif
