tags:
  - name: Auth
    description: Autentikasi, JWT token rotation, Google OAuth, dan profil pengguna

components:
  schemas:
    Role:
      type: string
      enum:
        - CUSTOMER
        - CASHIER
        - ADMIN
        - SPV
        - MANAGER
        - OWNER
        - OTHER
      example: CUSTOMER

    User:
      type: object
      properties:
        id:
          type: string
          example: "1"
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          nullable: true
          example: "john@mail.com"
        phone:
          type: string
          nullable: true
          example: "08123456789"
        role:
          $ref: "#/components/schemas/Role"
        google_id:
          type: string
          nullable: true
          example: "109876543210987654321"
        avatar:
          type: string
          nullable: true
          example: "https://lh3.googleusercontent.com/a/..."
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

paths:
  /api/auth/register:
    post:
      summary: Register pengguna baru
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - identifier
                - password
              properties:
                name:
                  type: string
                  example: "John Doe"
                identifier:
                  type: string
                  description: "Email atau nomor HP (08xxx / +62xxx)"
                  example: "john@mail.com"
                password:
                  type: string
                  format: password
                  example: "password123"
                role:
                  $ref: "#/components/schemas/Role"
                  description: "Role user (opsional, default: CUSTOMER)"

      responses:
        "201":
          description: Registrasi berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Registrasi berhasil"
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refreshToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "400":
          description: Format identifier tidak valid / password kurang dari 8 karakter / role tidak valid
        "409":
          description: Email atau nomor HP sudah terdaftar
        "500":
          description: Server error

  /api/auth/login:
    post:
      summary: Login dengan Email / No HP dan Password
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
                - password
              properties:
                identifier:
                  type: string
                  example: "john@mail.com"
                  description: "Email atau nomor HP"
                password:
                  type: string
                  format: password
                  example: "password123"

      responses:
        "200":
          description: Login berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Login berhasil"
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refreshToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "400":
          description: Identifier atau password kosong / akun Google tanpa password
        "401":
          description: Identifier atau password salah
        "403":
          description: Akun dinonaktifkan
        "500":
          description: Server error

  /api/auth/google:
    post:
      summary: Login & Registrasi via Google OAuth
      tags:
        - Auth
      description: Verifikasi ID Token dari Google Sign-In SDK di frontend, otomatis mendaftarkan user jika belum ada akun.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idToken
              properties:
                idToken:
                  type: string
                  description: Google ID Token dari Google Sign-In
                  example: "eyJhbGciOiJSUzI1NiIsImtpZCI6..."

      responses:
        "200":
          description: Login dengan Google berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Login dengan Google berhasil"
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refreshToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "400":
          description: idToken Google wajib diisi / akun tidak memiliki email
        "401":
          description: Token Google tidak valid atau kedaluwarsa
        "403":
          description: Akun dinonaktifkan
        "500":
          description: Server error

  /api/auth/refresh:
    post:
      summary: Refresh access token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

      responses:
        "200":
          description: Token berhasil diperbarui
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Token diperbarui"
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refreshToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        "400":
          description: refreshToken wajib diisi
        "401":
          description: Refresh token tidak valid atau kedaluwarsa
        "403":
          description: Akun dinonaktifkan
        "500":
          description: Server error

  /api/auth/logout:
    post:
      summary: Logout pengguna
      tags:
        - Auth
      security:
        - BearerAuth: []
        - cookieAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Refresh token yang ingin dibatalkan (opsional)
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

      responses:
        "200":
          description: Logout berhasil
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Logout berhasil"
        "401":
          description: Tidak terautentikasi
        "500":
          description: Server error

  /api/auth/forgot-password:
    post:
      summary: Lupa password (kirim link reset ke email)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - identifier
              properties:
                identifier:
                  type: string
                  description: Email atau nomor HP pengguna
                  example: "john@mail.com"

      responses:
        "200":
          description: Permintaan reset password diproses
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Jika akun dengan identifier tersebut terdaftar dan memiliki email, link reset telah dikirim."
        "400":
          description: Identifier wajib diisi
        "500":
          description: Server error

  /api/auth/reset-password:
    post:
      summary: Reset password dengan token verifikasi email
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tokenAccess
                - password
              properties:
                tokenAccess:
                  type: string
                  description: UUID reset token yang diterima via email
                  example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                password:
                  type: string
                  format: password
                  description: Password baru minimal 8 karakter
                  example: "PasswordBaru123!"

      responses:
        "200":
          description: Password berhasil direset
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password berhasil direset. Silakan login dengan password baru."
        "400":
          description: Token dan password wajib diisi / password kurang dari 8 karakter / token tidak valid atau kedaluwarsa
        "500":
          description: Server error

  /api/auth/me:
    get:
      summary: Ambil data profile user yang sedang login
      tags:
        - Auth
      security:
        - BearerAuth: []
        - cookieAuth: []

      responses:
        "200":
          description: Data profile pengguna
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          description: Tidak terautentikasi
        "403":
          description: Akun dinonaktifkan
        "500":
          description: Server error

  /api/auth/change-password:
    patch:
      summary: Ganti password user yang sedang login
      tags:
        - Auth
      security:
        - BearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                  example: "passwordLama123"
                newPassword:
                  type: string
                  format: password
                  description: Password baru minimal 8 karakter
                  example: "passwordBaru456"

      responses:
        "200":
          description: Password berhasil diubah
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Password berhasil diubah"
        "400":
          description: Password tidak cocok / password baru < 8 karakter / user Google-only
        "401":
          description: Tidak terautentikasi
        "500":
          description: Server error
