tags:
  - name: Product
    description: Manajemen data barang dan stok produk kasir

components:
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
        - cost_price
      properties:
        id:
          type: string
          example: "prod-1"
        category_id:
          type: string
          nullable: true
          example: "CAT-001"
        supplier_id:
          type: string
          nullable: true
          example: "SUPP-001"
        name:
          type: string
          example: "Galon Le Minerale 5 L"
        barcode:
          type: string
          nullable: true
          example: "8992759170570"
        price:
          type: number
          format: double
          example: 15000
        cost_price:
          type: number
          format: double
          example: 12000
        stock:
          type: integer
          example: 20
        min_stock:
          type: integer
          example: 5
        img_url:
          type: string
          nullable: true
          example: "https://le-minerale.com/assets/img/product/le-minerale-5l.png"
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: "2026-08-21T10:00:00.000Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-08-21T10:00:00.000Z"

    ProductCreateRequest:
      type: object
      required:
        - id
        - name
        - price
        - cost_price
      properties:
        id:
          type: string
          example: "prod-1"
        category_id:
          type: string
          nullable: true
          example: "CAT-001"
        supplier_id:
          type: string
          nullable: true
          example: "SUPP-001"
        name:
          type: string
          example: "Galon Le Minerale 5 L"
        barcode:
          type: string
          nullable: true
          example: "8992759170570"
        price:
          type: number
          format: double
          example: 15000
        cost_price:
          type: number
          format: double
          example: 12000
        stock:
          type: integer
          default: 0
          example: 20
        min_stock:
          type: integer
          default: 0
          example: 5
        img_url:
          type: string
          nullable: true
          example: "https://le-minerale.com/assets/img/product/le-minerale-5l.png"
        is_active:
          type: boolean
          default: true
          example: true

    ProductUpdateRequest:
      type: object
      properties:
        category_id:
          type: string
          nullable: true
          example: "CAT-001"
        supplier_id:
          type: string
          nullable: true
          example: "SUPP-001"
        name:
          type: string
          example: "Galon Le Minerale 5 L Updated"
        barcode:
          type: string
          nullable: true
          example: "8992759170570"
        price:
          type: number
          format: double
          example: 16000
        cost_price:
          type: number
          format: double
          example: 12500
        stock:
          type: integer
          example: 25
        min_stock:
          type: integer
          example: 5
        img_url:
          type: string
          nullable: true
          example: "https://le-minerale.com/assets/img/product/le-minerale-5l.png"
        is_active:
          type: boolean
          example: true

    ProductResponse:
      type: object
      properties:
        message:
          type: string
          example: "Product berhasil dibuat"
        data:
          $ref: "#/components/schemas/Product"

    ProductListResponse:
      type: object
      properties:
        message:
          type: string
          example: "List product"
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    ProductMessageResponse:
      type: object
      properties:
        message:
          type: string
          example: "Product berhasil dihapus"

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "Gagal mengambil data"
        error:
          type: string
          example: "Database connection error"

paths:
  /api/products:
    post:
      summary: Tambah product baru
      description: Membuat product baru. Hanya ADMIN yang diperbolehkan.
      tags:
        - Product
      security:
        - BearerAuth: []
        - cookieAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateRequest"

      responses:
        "201":
          description: Product berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"

        "400":
          description: Data wajib belum lengkap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "id, name, price, cost_price wajib diisi"

        "401":
          description: Tidak terautentikasi

        "403":
          description: Tidak punya izin

        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: Ambil semua product
      tags:
        - Product

      responses:
        "200":
          description: List product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"

        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/products/{id}:
    get:
      summary: Detail product by ID
      tags:
        - Product

      parameters:
        - in: path
          name: id
          required: true
          description: ID product
          schema:
            type: string
          example: "prod-1"

      responses:
        "200":
          description: Detail product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"

        "404":
          description: Product tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Product tidak ditemukan"

        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      summary: Update product
      description: Update data product. ADMIN atau MANAGER.
      tags:
        - Product
      security:
        - BearerAuth: []
        - cookieAuth: []

      parameters:
        - in: path
          name: id
          required: true
          description: ID product yang akan diupdate
          schema:
            type: string
          example: "prod-1"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdateRequest"

      responses:
        "200":
          description: Product berhasil diupdate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"

        "401":
          description: Tidak terautentikasi

        "403":
          description: Tidak punya izin

        "404":
          description: Product tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Product tidak ditemukan"

        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Hapus product
      description: Menghapus product. Hanya ADMIN yang diperbolehkan.
      tags:
        - Product
      security:
        - BearerAuth: []
        - cookieAuth: []

      parameters:
        - in: path
          name: id
          required: true
          description: ID product yang akan dihapus
          schema:
            type: string
          example: "prod-1"

      responses:
        "200":
          description: Product berhasil dihapus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductMessageResponse"

        "401":
          description: Tidak terautentikasi

        "403":
          description: Tidak punya izin

        "404":
          description: Product tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                message: "Product tidak ditemukan"

        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
